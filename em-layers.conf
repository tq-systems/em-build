LAYERS = openembedded-core meta-openembedded meta-arm meta-ti meta-rauc meta-emos

# Bitbake is special: it does not contain a layer, so it is not added to LAYERS
bitbake_repo              = https://git.openembedded.org/bitbake
bitbake_branch            = 2.8
bitbake_commit            = yocto-5.0.19

openembedded-core_repo    = https://git.openembedded.org/openembedded-core
openembedded-core_branch  = scarthgap
# Choose commit past tag 'yocto-5.0.19' to include CVE patches for sudo,tar,openssh
openembedded-core_commit  = 8aca19cff468c5f15c919c973c46be58e020af46
openembedded-core_subdirs = meta

meta-openembedded_repo    = https://git.openembedded.org/meta-openembedded
meta-openembedded_branch  = scarthgap
# Choose higher commit to include CVE fixes
meta-openembedded_commit  = 7eb94107580092f79ff1b639a87762fe6f96aa12
meta-openembedded_subdirs = meta-multimedia meta-networking meta-oe meta-python meta-webserver

meta-arm_repo             = https://git.yoctoproject.org/meta-arm
meta-arm_branch           = scarthgap
meta-arm_commit           = yocto-5.0.3
meta-arm_subdirs          = meta-arm-toolchain meta-arm

meta-ti_repo              = https://git.yoctoproject.org/meta-ti
meta-ti_branch            = scarthgap
meta-ti_commit            = 11.02.15
meta-ti_subdirs           = meta-ti-bsp

meta-rauc_repo            = https://github.com/rauc/meta-rauc.git
meta-rauc_branch          = scarthgap
meta-rauc_commit          = d63878f20eba7a85ecf53566e7a3377e78bb46ac

meta-emos_repo            = https://github.com/tq-systems/meta-emos.git
meta-emos_branch          = release/9.0.x
meta-emos_commit          = v9.0.5
